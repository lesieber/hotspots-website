<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Generate Json</title>
    <style>
        :root {
            --bg-color: #121212;
            --text-color: #b8b8b8;
            --card-bg: #1e1e1e;
            --border-color: #444;
            --button-bg: #2e2e2e;
            --button-hover: #636363;
            --delete-btn: #e53935;
            --delete-hover: #c62828;
            --accent-color: #4caf50;
        }
        
        body {
            font-family: "Segoe UI", sans-serif;
            background: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            display: flex;
            gap: 20px;
            max-width: 1400px;
            width: 100%;
            height: 100%;
        }
        
        /* Left Side: Preview */
        .preview {
            flex: 2;
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            background: var(--card-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        
        .image-container {
            position: relative;
            display: inline-block;
            max-width: 100%;
            max-height: 100%;
        }

        .preview img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            display: block; /* Remove bottom space */
        }
        
        /* Right Side: Controls */
        .controls {
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-right: 5px;
        }
        
        .upload-area {
            border: 2px dashed var(--border-color);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            background: var(--card-bg);
            cursor: pointer;
            transition: border-color 0.3s;
        }
        
        .upload-area:hover {
            border-color: var(--button-bg);
        }
        
        button {
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            background: var(--button-bg);
            color: #b8b8b8;
            transition: background 0.3s;
        }
        
        button:hover {
            background: var(--button-hover);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-row {
            display: flex;
            gap: 10px;
        }

        .btn-row button {
            flex: 1;
        }
        
        /* Output Area */
        .textbox {
            white-space: pre;
            padding: 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            min-height: 150px;
            font-size: 13px;
            font-family: 'Consolas', monospace;
            color: var(--accent-color);
            overflow: auto;
        }
        
        input[type="text"] {
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: #2b2b2b;
            color: var(--text-color);
            font-size: 14px;
            width: 100%;
            box-sizing: border-box;
        }
        
        input[type="text"]:focus {
            outline: 1px solid var(--accent-color);
        }
        
        .section-label {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Dots on Image */
        .dot {
            position: absolute;
            width: 8px;
            height: 8px;
            background: red;
            border: 1px solid white;
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%); /* Center dot on click */
            z-index: 10;
        }
        
        /* Area Cards */
        #dynamic-area-wrapper {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .new-area-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            padding: 12px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            transition: border-color 0.2s;
        }
        
        .active-area {
            border-color: var(--accent-color);
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.2);
        }

        .area-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 5px;
            border-bottom: 1px solid #333;
            padding-bottom: 5px;
        }

        .delete-area-btn {
            background: transparent;
            color: var(--delete-btn);
            padding: 4px 8px;
            font-size: 12px;
        }

        .delete-area-btn:hover {
            background: rgba(229, 57, 53, 0.1);
            color: var(--delete-hover);
        }
        
        /* Dynamic Inputs List */
        .dynamic-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .dynamic-row {
            display: flex;
            gap: 5px;
            align-items: center;
        }

        .remove-row-btn {
            background: transparent;
            color: #666;
            padding: 5px;
            width: 30px;
            text-align: center;
        }

        .remove-row-btn:hover {
            background: transparent;
            color: var(--delete-btn);
        }

    </style>
</head>
<body>
    <div class="container">
        <!-- Left: Image Preview -->
        <div class="preview" id="preview">
            <span>Image preview will appear here</span>
        </div>
        
        <!-- Right: Controls -->
        <div class="controls">
            <div>
                <div class="section-label">Image Name</div>
                <input type="text" id="img-name" placeholder="Enter image name (e.g. 'start')">
            </div>
            
            <div>
                <div class="section-label">Image Requirements</div>
                <div id="image-requirements-list" class="dynamic-list"></div>
            </div>

            <div class="upload-area" id="upload-area">
                Drag & Drop Image Here<br>
                <span style="font-size: 12px; color: #666;">or click to upload</span>
                <input type="file" id="file-input" accept="image/*" style="display:none;">
            </div>

            <div class="btn-row">
                <button id="new-area-btn">Start New Area</button>
                <button id="finish-area-btn" disabled>Finish Area</button>
            </div>

            <!-- Dynamic List of Areas -->
            <div id="dynamic-area-wrapper"></div>

            <div class="btn-row">
                <button id="generate-code" style="background-color: var(--accent-color); color: #fff;">Generate JSON</button>
                <button id="copy-code">Copy</button>
            </div>
            
            <div class="textbox" id="textbox">JSON will appear here...</div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const preview = document.getElementById('preview');
        const uploadArea = document.getElementById('upload-area');
        const imgName = document.getElementById('img-name');
        const newAreaBtn = document.getElementById('new-area-btn');
        const finishAreaBtn = document.getElementById('finish-area-btn');
        const generateCodeBtn = document.getElementById('generate-code');
        const copyCodeBtn = document.getElementById('copy-code');
        const textbox = document.getElementById('textbox');
        const dynamicAreaWrapper = document.getElementById('dynamic-area-wrapper');
        const imageReqList = document.getElementById('image-requirements-list');
        
        let areas = []; 
        let currentArea = null; 
        let image = null; 
        let imageRequirements = [""]; // Start with one empty requirement
        
        function init() {
            uploadArea.addEventListener('click', () => fileInput.click());
            fileInput.addEventListener('change', handleFileUpload);
            uploadArea.addEventListener('dragover', handleDragOver);
            uploadArea.addEventListener('dragleave', handleDragLeave);
            uploadArea.addEventListener('drop', handleDrop);
            newAreaBtn.addEventListener('click', createNewArea);
            finishAreaBtn.addEventListener('click', finishCurrentArea);
            generateCodeBtn.addEventListener('click', generateCode);
            copyCodeBtn.addEventListener('click', copyCode);

            // Init global image requirements list
            renderDynamicInputs(imageRequirements, imageReqList, 'Image Req (e.g. item:item_id)');
        }
        
        function handleFileUpload(e) {
            const file = e.target.files[0];
            processFile(file);
        }

        function processFile(file) {
            if (file) {
                const reader = new FileReader();
                reader.onload = () => {
                    preview.innerHTML = `<div class="image-container"><img id="image" src="${reader.result}" alt="Uploaded Image"></div>`;
                    image = document.getElementById('image');
                    image.onload = () => {
                        resetWorkspace();
                        // Suggest name based on file
                        imgName.value = file.name.split(".")[0];
                    };
                };
                reader.readAsDataURL(file);
            }
        }
        
        function resetWorkspace() {
            areas = [];
            currentArea = null;
            imageRequirements = [""];
            renderDynamicInputs(imageRequirements, imageReqList, 'Image Req (e.g. item:key)');
            renderAreaList();
            finishAreaBtn.disabled = true;
        }

        function handleDragOver(e) {
            e.preventDefault();
            uploadArea.style.borderColor = "var(--accent-color)";
        }
        
        function handleDragLeave() {
            uploadArea.style.borderColor = "var(--border-color)";
        }
        
        function handleDrop(e) {
            e.preventDefault();
            uploadArea.style.borderColor = "var(--border-color)";
            const file = e.dataTransfer.files[0];
            processFile(file);
        }
        
        function createNewArea() {
            if (!image) {
                alert('Please upload an image first.');
                return;
            }
            
            if (currentArea) {
                const valid = validateArea(currentArea);
                if (!valid) return;
                finishCurrentArea();
            }
            
            const newArea = {
                id: Date.now(), 
                actions: [""], 
                requirements: [""], // Add requirements array
                points: [],
                dots: []
            };
            
            areas.push(newArea);
            currentArea = newArea;
            
            enableImageClicking();
            renderAreaList();
            finishAreaBtn.disabled = false;

            // Focus on the input of the new area
            setTimeout(() => {
                const inputs = document.querySelectorAll(`[data-area-id="${newArea.id}"] input`);
                if(inputs.length > 0) inputs[0].focus();
            }, 50);
        }
        
        function enableImageClicking() {
            if (!image) return;
            image.removeEventListener('click', handleImageClick);
            image.addEventListener('click', handleImageClick);
        }
        
        function handleImageClick(e) {
            if (!currentArea) return;
            
            const rect = image.getBoundingClientRect();
            // Calculate relative to the image element, not the container
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const maxX = rect.width;
            const maxY = rect.height;
            
            // Normalized coordinates (0 to 1)
            const normalizedPoint = {
                x: x / maxX,
                y: 1 - (y / maxY) // Keeps original logic (Inverted Y)
            };
            
            currentArea.points.push(normalizedPoint);
            
            // Visual Dot
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.style.left = `${x}px`;
            dot.style.top = `${y}px`;
            
            // Append to image parent (the container)
            image.parentElement.appendChild(dot);
            currentArea.dots.push(dot);
            
            // Update UI point counter
            renderAreaList(false); // false = don't rebuild inputs to keep focus
        }
        
        function validateArea(area) {
            if (area.points.length < 3) {
                alert('An area needs at least 3 points.');
                return false;
            }
            // Filter out empty actions
            const validActions = area.actions.filter(a => a.trim() !== "");
            if (validActions.length === 0) {
                alert('You have to enter at least one action.');
                return false;
            }
            return true;
        }

        function finishCurrentArea() {
            if (!currentArea) return;
            
            if(!validateArea(currentArea)) return;

            if (image) {
                image.removeEventListener('click', handleImageClick);
            }
            
            currentArea = null;
            renderAreaList();
            finishAreaBtn.disabled = true;
        }
        
        function deleteArea(areaId) {
            const areaIndex = areas.findIndex(area => area.id === areaId);
            if (areaIndex === -1) return;
            
            const area = areas[areaIndex];
            
            // Remove dots from DOM
            area.dots.forEach(dot => dot.remove());
            
            areas.splice(areaIndex, 1);
            
            if (currentArea && currentArea.id === areaId) {
                currentArea = null;
                finishAreaBtn.disabled = true;
                if (image) image.removeEventListener('click', handleImageClick);
            }
            
            renderAreaList();
        }
        
        // This function re-renders the DOM for the list. 
        // 'fullRebuild' determines if we destroy and recreate input fields (which kills focus)
        function renderAreaList(fullRebuild = true) {
            // If we are just updating points count, try to update text only
            if (!fullRebuild) {
                areas.forEach(area => {
                    const countEl = document.getElementById(`count-${area.id}`);
                    if(countEl) countEl.innerText = `${area.points.length} points`;
                });
                // Update active state class
                const allCards = dynamicAreaWrapper.querySelectorAll('.new-area-container');
                allCards.forEach(card => {
                    if(currentArea && card.dataset.areaId == currentArea.id) {
                        card.classList.add('active-area');
                    } else {
                        card.classList.remove('active-area');
                    }
                });
                return;
            }

            dynamicAreaWrapper.innerHTML = '';
            
            areas.forEach(area => {
                const areaContainer = document.createElement('div');
                areaContainer.className = `new-area-container ${currentArea && currentArea.id === area.id ? 'active-area' : ''}`;
                areaContainer.dataset.areaId = area.id;
                
                // Header (Points count + Delete)
                const header = document.createElement('div');
                header.className = 'area-header';
                header.innerHTML = `
                    <span id="count-${area.id}">${area.points.length} points</span>
                `;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-area-btn';
                deleteBtn.innerHTML = '<i class="fa-solid fa-trash"></i>';
                deleteBtn.onclick = (e) => {
                    e.stopPropagation(); // Prevent triggering area selection if added later
                    if(confirm("Delete this area?")) deleteArea(area.id);
                };
                header.appendChild(deleteBtn);
                areaContainer.appendChild(header);

                // --- Actions Section ---
                const actionLabel = document.createElement('div');
                actionLabel.className = 'section-label';
                actionLabel.textContent = 'Actions';
                areaContainer.appendChild(actionLabel);

                const actionList = document.createElement('div');
                actionList.className = 'dynamic-list';
                renderDynamicInputs(area.actions, actionList, 'Action (e.g. item:add:redbull)');
                areaContainer.appendChild(actionList);

                // --- Requirements Section ---
                const reqLabel = document.createElement('div');
                reqLabel.className = 'section-label';
                reqLabel.textContent = 'Button Requirements';
                areaContainer.appendChild(reqLabel);

                const reqList = document.createElement('div');
                reqList.className = 'dynamic-list';
                renderDynamicInputs(area.requirements, reqList, 'Requirement (e.g. item:redbull:true)');
                areaContainer.appendChild(reqList);

                dynamicAreaWrapper.appendChild(areaContainer);
            });
        }

        // Generic function to render a list of inputs that auto-expands
        function renderDynamicInputs(dataArray, container, placeholderText) {
            container.innerHTML = '';
            
            dataArray.forEach((text, index) => {
                const row = document.createElement('div');
                row.className = 'dynamic-row';
                
                const input = document.createElement('input');
                input.type = 'text';
                input.placeholder = index === 0 ? placeholderText : 'Add another...';
                input.value = text;
                
                input.addEventListener('input', (e) => {
                    dataArray[index] = e.target.value;
                    
                    // Logic: If user types in the last input, add a new empty one below
                    if (index === dataArray.length - 1 && e.target.value.trim() !== "") {
                        dataArray.push("");
                        // Re-render to show new input
                        renderDynamicInputs(dataArray, container, placeholderText);
                        
                        // Restore focus to the input we were typing in
                        const inputs = container.querySelectorAll('input');
                        if (inputs[index]) {
                            inputs[index].focus(); 
                            const val = inputs[index].value;
                            inputs[index].setSelectionRange(val.length, val.length);
                        }
                    }
                });

                // Delete button logic
                // Only show if it's not the only empty field (allow clearing, but keep at least one)
                if (dataArray.length > 1) {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'remove-row-btn';
                    removeBtn.innerHTML = '&times;';
                    removeBtn.title = "Remove entry";
                    removeBtn.tabIndex = -1; // Skip tab stop
                    removeBtn.onclick = () => {
                        dataArray.splice(index, 1);
                        if(dataArray.length === 0) dataArray.push("");
                        renderDynamicInputs(dataArray, container, placeholderText);
                    };
                    row.appendChild(input);
                    row.appendChild(removeBtn);
                } else {
                    row.appendChild(input);
                }

                container.appendChild(row);
            });
        }
        
        function generateCode() {
            const imageName = imgName.value.trim() || "unnamed";
            
            if (areas.length === 0) {
                alert('There has to be at least one area defined.');
                return;
            }

            // Clean Image Requirements
            const cleanImageReqs = imageRequirements.filter(r => r.trim() !== "");

            // Constructing the JSON structure
            const customHotspots = areas.map(area => {
                const polygonString = area.points.map(point => 
                    `${point.x},${point.y}`
                ).join(';');
                
                // Filter out empty inputs
                const cleanActions = area.actions.filter(a => a.trim() !== "");
                const cleanReqs = area.requirements.filter(r => r.trim() !== "");
                
                return {
                    actions: cleanActions.length > 0 ? cleanActions : ["unnamed"],
                    requirements: cleanReqs, 
                    polygonString: polygonString
                };
            });
            
            // Nested structure matching the request
            const data = {
                [imageName]: {
                    "states": {
                        "main": {
                            "requirements": cleanImageReqs,
                            "path": `Assets/Images/Navigation/${imageName}.jpg`
                        }
                    },
                    "customHotspots": customHotspots
                }
            };
            
            const jsonString = JSON.stringify(data, null, 4);
            // Remove outer braces to match the fragment style
            const trimmed = jsonString.trim().replace(/^\{/, '').replace(/\}$/, '').trim();
            
            textbox.innerText = trimmed;
        }
        
        function copyCode() {
            const code = textbox.innerText;
            if (!code || code === "JSON will appear here...") {
                alert('No code to copy.');
                return;
            }
            
            navigator.clipboard.writeText(code)
                .then(() => {
                    const originalText = copyCodeBtn.innerText;
                    copyCodeBtn.innerText = "Copied!";
                    setTimeout(() => copyCodeBtn.innerText = originalText, 2000);
                })
                .catch(err => {
                    console.error('Failed to copy: ', err);
                });
        }       
        
        init();
    </script>
</body>
</html>
